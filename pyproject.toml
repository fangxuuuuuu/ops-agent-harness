[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-harness"
version = "0.1.0"
description = "Agent Harness for an operations assistant: bounded LLM-tool loop, validation, approvals, observability."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ops_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
